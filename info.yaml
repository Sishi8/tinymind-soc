# Tiny Tapeout project information
project:
  title:        "TinyMind Clocked Version"
  author:       "Sishi"
  discord:      ""
  description:  "A clocked 8-input, 3-class fixed-weight neural-network inference accelerator for TinyTapeout."
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Top module must match the module name in src/project.v
  top_module:  "tt_um_sishi888_tinymind"

  # Source files
  source_files:
    - "project.v"


# Pinout of the project
pinout:

  # Inputs - eight binary TinyMind features
  ui[0]: "Likes mathematics"
  ui[1]: "Likes programming"
  ui[2]: "Likes electronics"
  ui[3]: "Likes physics"
  ui[4]: "Likes data and patterns"
  ui[5]: "Likes building things"
  ui[6]: "Likes design and creativity"
  ui[7]: "Likes experimentation and research"

  # Seven-segment display outputs
  uo[0]: "Segment g"
  uo[1]: "Segment f"
  uo[2]: "Segment e"
  uo[3]: "Segment d"
  uo[4]: "Segment c"
  uo[5]: "Segment b"
  uo[6]: "Segment a"
  uo[7]: "Close prediction decimal point"

  # Bidirectional pins are unused
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""


# Do not change!
yaml_version: 6
